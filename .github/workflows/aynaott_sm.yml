name: AynaOTT Auto Update

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Public Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch Python Script
        env:
          REPO_NAME: ${{ secrets.SECRET_REPO_NAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone https://x-access-token:${GH_PAT}@github.com/sm-monirulislam/${REPO_NAME}.git private_code
          cp private_code/scripts/aynaott_sm.py .
          rm -rf private_code

      - name: Run Scraper Script
        run: python aynaott_sm.py

      - name: Remove Python Script
        run: rm -f aynaott_sm.py

      - name: Commit and Push Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aynaott.m3u aynaott_data.json
          git diff --cached --quiet || git commit -m "Update AynaOTT playlist & JSON"
          git push
